# Keep committed build output and scaffold metadata byte-for-byte reproducible,
# the design site's generated pages, fonts and images included.
exclude: '^(\.copier-answers.*\.ya?ml$|src/.*/static-blocks/|src/.*/static/derico\.min\.css(\.map)?$|src/.*/upgrades/[^/]+/metadata\.txt$|docs/design/[^/]+/site/(.+\.html|assets/(fonts|images)/.+)$)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
