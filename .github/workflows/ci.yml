name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLICCA_TOKEN: ${{ secrets.BLICCA_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: plonetheme.derico

    steps:
      # [tool.uv.sources] resolves the unreleased dependencies from "../<name>".
      # `actions/checkout` refuses paths outside the workspace, so this package
      # moves into a subdirectory and its siblings go beside it.
      - uses: actions/checkout@v4
        with:
          path: plonetheme.derico

      # plone.blicca.auroraeditor is not optional and is not on PyPI. It is
      # the editor the brand blocks mount in, the source of the promised
      # rendering API `browser/hero.py` imports, and a GenericSetup profile
      # dependency — so without it this package does not install, its ZCML
      # does not load, and its profile cannot be applied. It is also where the
      # lockstep guards (hero ticket 04 §9) get their upstream from.
      #
      # The repository is PRIVATE, so this needs a token with read access
      # (to it and to any other private sibling below). Missing token = red
      # job, deliberately: a named failure beats a green run over an
      # uninstallable package.
      - name: Require the sibling checkout token
        if: env.BLICCA_TOKEN == ''
        working-directory: .
        run: |
          echo "::error::BLICCA_TOKEN is not set. plonetheme.derico depends on"
          echo "::error::plone.blicca.auroraeditor, which is private and not on"
          echo "::error::PyPI, so neither the install nor the tests can run."
          exit 1

      - name: Check out plonetheme.clara
        uses: actions/checkout@v4
        with:
          repository: MrTango/plonetheme.clara
          ref: main
          token: ${{ env.BLICCA_TOKEN }}
          path: plonetheme.clara

      - name: Check out plone.pageletlayout
        uses: actions/checkout@v4
        with:
          repository: MrTango/plone.pageletlayout
          ref: main
          token: ${{ env.BLICCA_TOKEN }}
          path: plone.pageletlayout

      - name: Check out plone.app.viewletmanager
        uses: actions/checkout@v4
        with:
          repository: plone/plone.app.viewletmanager
          ref: additional-viewlets
          path: plone.app.viewletmanager

      - name: Check out collective.fragmentsblock
        uses: actions/checkout@v4
        with:
          repository: collective/collective.fragmentsblock
          ref: main
          path: collective.fragmentsblock

      - name: Check out derico.blicca.promoblock
        uses: actions/checkout@v4
        with:
          repository: MrTango/derico.blicca.promoblock
          ref: main
          token: ${{ env.BLICCA_TOKEN }}
          path: derico.blicca.promoblock

      - name: Check out plone.blicca.auroraeditor
        uses: actions/checkout@v4
        with:
          repository: derico-de/plone.blicca.auroraeditor
          ref: main
          token: ${{ env.BLICCA_TOKEN }}
          path: plone.blicca.auroraeditor

      - name: Check out plone.namedfile
        uses: actions/checkout@v4
        with:
          repository: plone/plone.namedfile
          ref: avif-support
          path: plone.namedfile

      - name: Check out plone.scale
        uses: actions/checkout@v4
        with:
          repository: plone/plone.scale
          ref: avif-support
          path: plone.scale

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: plonetheme.derico/uv.lock

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff
        run: uvx ruff check .

  # Hero ticket 04 §10. `static-blocks/` is committed build output and nothing
  # rebuilds it at install time, so it rots the moment someone edits source and
  # forgets to rebuild. The `git diff --exit-code` is the only thing that makes
  # committing artifacts safe rather than merely convenient.
  #
  # Single-repo on purpose: vendoring `scope-wrap.ts` (04 §7) is what bought
  # this job its independence from a sibling checkout.
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: bundle-src/.nvmrc
          cache: pnpm
          cache-dependency-path: bundle-src/pnpm-lock.yaml

      # `working-directory`, not `--dir`: corepack resolves the pnpm version
      # from the *current* directory, and the repository root has no
      # package.json. From root it falls back to its own bundled pnpm, which
      # then refuses to run against the `packageManager` pin it reads out of
      # bundle-src/package.json ("pnpm does not switch versions when running
      # under corepack"). Standing in bundle-src is what lets the pin apply.
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: bundle-src

      - name: Typecheck
        run: pnpm typecheck
        working-directory: bundle-src

      - name: Test
        run: pnpm test
        working-directory: bundle-src

      - name: Build
        run: pnpm build
        working-directory: bundle-src

      # If this fails, someone edited bundle-src/src/ and did not rebuild.
      - name: Committed artifacts match their source
        run: git diff --exit-code -- src/plonetheme/derico/static-blocks/
