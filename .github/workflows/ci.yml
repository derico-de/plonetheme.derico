name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLICCA_SSH_KEY: ${{ secrets.BLICCA_SSH_KEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: plonetheme.derico

    steps:
      # [tool.uv.sources] resolves the unreleased dependencies from "../<name>".
      # `actions/checkout` refuses paths outside the workspace, so this package
      # moves into a subdirectory and its siblings go beside it.
      - uses: actions/checkout@v4
        with:
          path: plonetheme.derico

      # plone.blicca.auroraeditor is not optional and is not on PyPI. It is
      # the editor the brand blocks mount in, the source of the promised
      # rendering API `browser/hero.py` imports, and a GenericSetup profile
      # dependency — so without it this package does not install, its ZCML
      # does not load, and its profile cannot be applied. It is also where the
      # lockstep guards get their upstream from.
      #
      # The repository is PRIVATE, so use a read-only deploy key scoped to
      # it, not a personal access token. Missing key = red job, deliberately:
      # a named failure beats a green run over an uninstallable package.
      - name: Require the host checkout key
        if: env.BLICCA_SSH_KEY == ''
        working-directory: .
        run: |
          echo "::error::BLICCA_SSH_KEY is not set. plonetheme.derico depends on"
          echo "::error::plone.blicca.auroraeditor, which is private and not on"
          echo "::error::PyPI, so neither the install nor the tests can run."
          exit 1

      - name: Check out plonetheme.clara
        uses: actions/checkout@v4
        with:
          repository: MrTango/plonetheme.clara
          ref: main
          path: plonetheme.clara

      - name: Check out plone.pageletlayout
        uses: actions/checkout@v4
        with:
          repository: MrTango/plone.pageletlayout
          ref: main
          path: plone.pageletlayout

      - name: Check out plone.app.viewletmanager
        uses: actions/checkout@v4
        with:
          repository: plone/plone.app.viewletmanager
          ref: additional-viewlets
          path: plone.app.viewletmanager

      - name: Check out collective.fragmentsblock
        uses: actions/checkout@v4
        with:
          repository: collective/collective.fragmentsblock
          ref: main
          path: collective.fragmentsblock

      - name: Check out derico.blicca.promoblock
        uses: actions/checkout@v4
        with:
          repository: derico-de/derico.blicca.promoblock
          ref: main
          path: derico.blicca.promoblock

      - name: Check out plone.blicca.auroraeditor
        uses: actions/checkout@v4
        with:
          repository: derico-de/plone.blicca.auroraeditor
          ref: main
          ssh-key: ${{ env.BLICCA_SSH_KEY }}
          persist-credentials: false
          path: plone.blicca.auroraeditor

      - name: Check out plone.namedfile
        uses: actions/checkout@v4
        with:
          repository: plone/plone.namedfile
          ref: avif-support
          path: plone.namedfile

      - name: Check out plone.scale
        uses: actions/checkout@v4
        with:
          repository: plone/plone.scale
          ref: avif-support
          path: plone.scale

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: plonetheme.derico/uv.lock

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff
        run: uvx ruff check .

  # `static-blocks/` is committed build output; the final diff fails when a
  # source edit was not rebuilt.
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Committed artifacts match their source
        run: git diff --exit-code -- src/plonetheme/derico/static-blocks/
